<script>
const A='https://data.etabus.gov.hk/v1/transport/kmb/';const j=u=>fetch(A+u).then(r=>r.json());
let stops={},names={},eta=[],routes={},lastSt=null;
const fx=t=>(t||'').replace(/巿/g,'市');
async function init(){const etaP=load();try{names=JSON.parse(localStorage.getItem('kmb284names')||'{}')}catch(e){names={}}
 const info=await Promise.all([['outbound','O'],['inbound','I']].map(async([b,d])=>{const [r,rs]=await Promise.all([j('route/284/'+b+'/1'),j('route-stop/284/'+b+'/1')]);return {d,r,rs}}));
 const need=new Set();info.forEach(({d,r,rs})=>{if(r.data&&r.data.orig_tc&&rs.data&&rs.data.length){routes[d]=r.data;stops[d]=rs.data;rs.data.forEach(s=>{if(!names[s.stop])need.add(s.stop)})}});
 await Promise.all([...need].map(async id=>{names[id]=(await j('stop/'+id)).data}));try{localStorage.setItem('kmb284names',JSON.stringify(names))}catch(e){}
 fillDir();fill();await etaP;render();setInterval(load,30000)}
function fillDir(){const v=dir.value;dir.length=0;['O','I'].forEach(d=>{if(routes[d])dir.add(new Option(T(d)+T('colon')+nm(routes[d],'orig')+' → '+nm(routes[d],'dest'),d))});if(v)dir.value=v}
function fill(){const v=pick.value;pick.length=1;pick.options[0].text=T('allStops');(stops[dir.value]||[]).forEach(s=>pick.add(new Option(s.seq+'. '+nm(names[s.stop],'name'),s.seq)));if(v&&[...pick.options].some(o=>o.value==v))pick.value=v;render()}
function showSt(){if(!lastSt)return;st.textContent=lastSt.err?T('loadFail',{e:lastSt.err}):T('upd',{t:tm(lastSt.now),d:lastSt.ts?tm(lastSt.ts):'—'})}
async function load(){try{const r=await j('route-eta/284/1');eta=r.data||[];lastSt={now:new Date(),ts:eta.length&&eta[0].data_timestamp?new Date(eta[0].data_timestamp):null};showSt();render()}catch(e){lastSt={err:String(e)};showSt()}}
function fmt(e){if(!e.eta)return rmk(e)||T('noSvc');const m=Math.round((new Date(e.eta)-Date.now())/60000);const hm=new Date(e.eta).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Hong_Kong'});const k=rmk(e);return (m<=0?T('arriving'):T('mins',{m}))+' ('+hm+')'+(k?' '+k:'')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){if(!dir.options.length)return;const d=dir.value,q=qv(),p=pick.value;list.innerHTML='';(stops[d]||[]).forEach(s=>{const n=names[s.stop];if(p&&s.seq!=p)return;if(q&&!((n.name_tc+n.name_en+(n.name_sc||t2s(n.name_tc))).toLowerCase().includes(q)))return;
 const es=eta.filter(e=>e.dir==d&&e.seq==+s.seq&&!(e.eta&&new Date(e.eta)<Date.now()-120000));const el=document.createElement('div');el.className='s';
 el.innerHTML='<div class="n" data-raw>'+s.seq+'. '+esc(nm(n,'name'))+'</div><div class="e" data-raw>'+esc(nm2(n,'name'))+'</div><div class="t">'+(es.length?es.map(fmt).map(esc).join('<br>'):T('noEta'))+'</div>';list.append(el)})}
const qv=()=>q.value.trim().toLowerCase();dir.onchange=fill;pick.onchange=render;q.oninput=render;r.onclick=load;init();
</script>

 fstop.length=0;fillFstop();fstop.style.display=fsave.style.display=''}

 if(favs.some(y=>y.route==f.route&&y.dir==f.dir&&y.st==f.st&&y.seq==f.seq)){setErr('dup');return}favs.push(f);saveF();loadF()};
function drawF(){if(!lastF)return;const {res,ts,now}=lastF;
